<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Plantilla web para reserva de citas médicas.">
    <title>Reserva médica</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#" aria-label="Clínica Salud, inicio">Clínica Salud</a>
      <span>Atención cercana, cuando la necesitas</span>
    </header>

    <main>
      <section class="booking-card" aria-labelledby="page-title">
        <p class="eyebrow">Tu salud es nuestra prioridad</p>
        <h1 id="page-title">Reserva tu cita médica</h1>
        <p class="intro">Completa tus datos y nuestro equipo se pondrá en contacto contigo para confirmar la cita.</p>

        <form>
          <label for="name">Nombre completo</label>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="Tu nombre" required>

          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="nombre@ejemplo.com" required>

          <label for="specialty">Especialidad</label>
          <select id="specialty" name="specialty" required>
            <option value="" selected disabled>Selecciona una especialidad</option>
            <option value="medicina-general">Medicina general</option>
            <option value="pediatria">Pediatría</option>
            <option value="cardiologia">Cardiología</option>
          </select>

          <button type="submit">Solicitar cita</button>
        </form>
        <p class="note">Esta plantilla es estática; el formulario requiere un backend para enviar solicitudes.</p>
      </section>
    </main>
  </body>
</html>
